<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        /* Absolute Units */
        .container {
            height: 200px;
            width: 100px;
            border: 1px solid black
        }
        
        /* Relative Units */
        .box {
            height: 50%;
            width: 50%;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">

        </div>
    </div>
</body>
</html>
